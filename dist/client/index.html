<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claudio — FM sound design</title>
    <style>
      :root {
        --bg: #14131a;
        --panel: #1d1c26;
        --line: #322f40;
        --text: #e8e6f0;
        --dim: #9a95b0;
        --accent: #b9a4ff;
        --good: #7ee0a8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 80px; }

      /* Two columns: iterations live in the rail, the instrument stays centre stage. */
      .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
      .rail { position: sticky; top: 24px; }
      @media (max-width: 860px) {
        .layout { grid-template-columns: minmax(0, 1fr); }
        .rail { position: static; order: 2; }
      }

      /* "working" indicator */
      .dots { display: inline-flex; gap: 4px; margin-left: 2px; vertical-align: middle; }
      .dots > i {
        width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
        animation: pulse 1.1s ease-in-out infinite;
      }
      .dots > i:nth-child(2) { animation-delay: .15s; }
      .dots > i:nth-child(3) { animation-delay: .3s; }
      @keyframes pulse {
        0%, 80%, 100% { opacity: .22; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }
      .working { border-color: var(--accent) !important; }
      .working .bar > i {
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        background-size: 200% 100%; animation: sweep 1.1s linear infinite; width: 100% !important;
      }
      @keyframes sweep { from { background-position: 200% 0; } to { background-position: -200% 0; } }
      h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
      .sub { color: var(--dim); margin: 0 0 28px; font-size: 14px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 16px;
      }
      #drop {
        border: 1.5px dashed var(--line);
        border-radius: 10px;
        padding: 34px 18px;
        text-align: center;
        color: var(--dim);
        cursor: pointer;
        transition: border-color .15s, color .15s;
      }
      #drop.over, #drop:hover { border-color: var(--accent); color: var(--text); }
      button {
        background: #2b2839; color: var(--text); border: 1px solid var(--line);
        border-radius: 7px; padding: 7px 13px; font: inherit; font-size: 14px; cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: .45; cursor: default; }
      input[type=text], input[type=password] {
        background: #14131a; color: var(--text); border: 1px solid var(--line);
        border-radius: 7px; padding: 8px 11px; font: inherit; font-size: 14px;
      }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .attempt { border-top: 1px solid var(--line); padding: 11px 0; }
      .attempt:first-child { border-top: 0; }
      .dist { font-variant-numeric: tabular-nums; font-weight: 600; }
      .bar { height: 4px; background: #2b2839; border-radius: 2px; overflow: hidden; margin-top: 7px; }
      .bar > i { display: block; height: 100%; background: var(--accent); }
      .muted { color: var(--dim); }
      .tag {
        font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
        color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
      }
      pre {
        background: #14131a; border: 1px solid var(--line); border-radius: 7px;
        padding: 11px; overflow-x: auto; font-size: 12px; margin: 8px 0 0;
      }
      .hidden { display: none; }
      code { color: var(--accent); }

      /* keyboard */
      .keys { position: relative; height: 130px; user-select: none; touch-action: none; }
      .key { position: absolute; top: 0; border-radius: 0 0 5px 5px; cursor: pointer; }
      .key.white {
        position: relative; display: inline-block; width: var(--kw); height: 100%;
        background: #ece9f5; border: 1px solid #0e0d12; margin-left: -1px;
        vertical-align: top;
      }
      .key.white > span {
        position: absolute; bottom: 7px; left: 0; right: 0; text-align: center;
        font-size: 10px; color: #7b7690;
      }
      .key.black {
        width: calc(var(--kw) * 0.6); height: 62%; background: #26232f;
        border: 1px solid #0e0d12; z-index: 2;
      }
      .key.black > span {
        position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
        font-size: 10px; color: #8e88a6;
      }
      .key.white.on { background: var(--accent); }
      .key.black.on { background: #6f5bc4; }

      /* suggestion chips */
      .chip {
        border-radius: 999px; padding: 6px 13px; font-size: 13px;
        background: #262336; border-color: #3d3852;
      }
      .chip:hover:not(:disabled) { background: #2f2b42; border-color: var(--accent); }
    </style>
    <script type="module" crossorigin src="/assets/index-Co0nH00f.js"></script>
  </head>
  <body>
    <main id="app">
      <h1>Claudio</h1>
      <p class="sub">Upload a sound. An agent reverse-engineers it into an FM patch, then you talk to it.</p>
      <div class="panel"><p id="boot" class="muted">Starting…</p></div>
    </main>
  </body>
</html>
